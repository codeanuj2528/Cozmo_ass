[project]
name = "cozmo"
version = "0.1.0"
description = "Multi-tier indoor capture to dimensioned floor plan, damage assessment and repair scope"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "shapely>=2.0",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "opencv-python>=4.9",
    "pillow>=10.0",
    # HEIC is the iPhone camera's default still format; without this the photo tier cannot read one.
    "pillow-heif>=0.16",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "networkx>=3.2",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.44",
    "timm>=1.0",
    "huggingface-hub>=0.24",
    "safetensors>=0.4",
    # VGGT's model code imports it; VGGT itself is installed --no-deps by scripts/setup.sh.
    "einops>=0.7",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
cozmo = "cozmo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cozmo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# NumPy on Apple's Accelerate BLAS raises these on matrix products whose inputs and
# outputs are entirely finite; see src/cozmo/util/numpy_compat.py, which documents the
# reproduction and is asserted by tests/test_numpy_compat.py. Filtered here as well
# because pytest resets warning filters at startup, and the noise hides real warnings.
filterwarnings = [
    "ignore:divide by zero encountered in matmul:RuntimeWarning",
    "ignore:overflow encountered in matmul:RuntimeWarning",
    "ignore:invalid value encountered in matmul:RuntimeWarning",
]
